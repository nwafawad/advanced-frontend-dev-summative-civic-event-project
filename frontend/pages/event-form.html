<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event form, CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="bg-page text-ink">
  <main id="main">
  <a href="events.html" class="text-sm text-brand underline">Back to events</a>
  <h1 class="mt-4 text-2xl font-bold">New event</h1>

  <form id="event-form" class="mt-6 max-w-2xl space-y-5 rounded-lg border border-gray-200 bg-white p-6" novalidate>
    <p id="form-error" role="alert" class="empty:hidden rounded-md bg-red-50 p-3 text-sm text-red-800"></p>

    <div>
      <label for="title" class="block text-sm font-semibold">Title</label>
      <input id="title" type="text" aria-describedby="title-error"
             class="mt-1 w-full rounded-md border border-gray-400 px-3 py-2">
      <p id="title-error" class="mt-1 text-sm text-red-700"></p>
    </div>

    <div>
      <label for="description" class="block text-sm font-semibold">Description <span class="font-normal text-muted">(optional)</span></label>
      <textarea id="description" rows="5" class="mt-1 w-full rounded-md border border-gray-400 px-3 py-2"></textarea>
    </div>

    <div>
      <label for="location" class="block text-sm font-semibold">Location</label>
      <input id="location" type="text" aria-describedby="location-error"
             class="mt-1 w-full rounded-md border border-gray-400 px-3 py-2">
      <p id="location-error" class="mt-1 text-sm text-red-700"></p>
    </div>

    <div class="grid gap-5 sm:grid-cols-2">
      <div>
        <label for="starts_at" class="block text-sm font-semibold">Starts</label>
        <input id="starts_at" type="datetime-local" aria-describedby="starts_at-error"
               class="mt-1 w-full rounded-md border border-gray-400 px-3 py-2">
        <p id="starts_at-error" class="mt-1 text-sm text-red-700"></p>
      </div>
      <div>
        <label for="ends_at" class="block text-sm font-semibold">Ends</label>
        <input id="ends_at" type="datetime-local" aria-describedby="ends_at-error"
               class="mt-1 w-full rounded-md border border-gray-400 px-3 py-2">
        <p id="ends_at-error" class="mt-1 text-sm text-red-700"></p>
      </div>
    </div>

    <div>
      <label for="image" class="block text-sm font-semibold">Image <span class="font-normal text-muted">(optional)</span></label>
      <p id="image-hint" class="text-xs text-muted">JPG, PNG or GIF, up to 2 MB.</p>
      <input id="image" type="file" accept=".jpg,.jpeg,.png,.gif" aria-describedby="image-hint image-error"
             class="mt-2 block w-full text-sm file:mr-3 file:rounded-md file:border-0 file:bg-brand-tint file:px-3 file:py-2 file:font-semibold file:text-brand">
      <p id="image-error" class="mt-1 text-sm text-red-700"></p>
      <img id="image-preview" alt="Preview of the event image" class="mt-3 hidden max-h-48 rounded-md object-cover">
    </div>

    <div class="flex items-start gap-3">
      <input id="published" type="checkbox" role="switch" checked aria-describedby="published-hint" class="mt-1 h-4 w-4">
      <div>
        <label for="published" class="text-sm font-semibold">Published</label>
        <p id="published-hint" class="text-xs text-muted">
          Published events are visible to all users. Note: the provided API currently saves every event as published.
        </p>
      </div>
    </div>

    <!-- Shown only while an image is uploading -->
    <div id="upload-status" class="hidden">
      <label id="upload-label" for="upload-progress" class="text-sm">Uploading image: 0%</label>
      <progress id="upload-progress" max="100" value="0" class="mt-1 w-full"></progress>
    </div>

    <div class="flex flex-wrap gap-3">
      <button type="submit" id="save-btn"
              class="rounded-md bg-brand px-5 py-2.5 font-semibold text-white hover:bg-brand-dark">Create event</button>
      <a id="cancel-link" href="events.html" class="rounded-md border border-gray-400 px-5 py-2.5 font-semibold">Cancel</a>
    </div>
  </form>
</main>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/event-form.js"></script>
</body>
</html>
