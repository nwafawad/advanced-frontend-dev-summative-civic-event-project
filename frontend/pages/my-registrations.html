<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My registrations, CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="bg-page text-ink">
  <main id="main">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 tabindex="-1" class="text-2xl font-bold">My registrations</h1>
        <p id="result-count" class="mt-1 text-sm text-muted"></p>
      </div>
      <div>
        <label for="show" class="block text-sm font-semibold">Show</label>
        <select id="show" class="mt-1 rounded-md border border-gray-400 px-3 py-2 text-sm">
          <option value="upcoming">Upcoming</option>
          <option value="past">Past</option>
          <option value="cancelled">Cancelled</option>
          <option value="all">All</option>
        </select>
      </div>
    </div>
    <div id="registration-list" class="mt-6 space-y-3"></div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/event-actions.js"></script>
  <script src="../js/pages/my-registrations.js"></script>
</body>
</html>
