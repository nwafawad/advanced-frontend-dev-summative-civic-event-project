<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcement form, CivicEvents+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/tailwind.config.js"></script>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body class="bg-page text-ink">
    <main id="main">
      <a
        id="back-link"
        href="announcements.html"
        class="text-sm text-brand underline"
        >Back to announcements</a
      >
      <h1 class="mt-4 text-2xl font-bold">New announcement</h1>

      <form
        id="announcement-form"
        class="mt-6 max-w-2xl space-y-5 rounded-lg border border-gray-200 bg-white p-6"
        novalidate
      >
        <p
          id="form-error"
          role="alert"
          class="empty:hidden rounded-md bg-red-50 p-3 text-sm text-red-800"
        ></p>

        <div>
          <label for="title" class="block text-sm font-semibold">Title</label>
          <input
            id="title"
            type="text"
            aria-describedby="title-error"
            class="mt-1 w-full rounded-md border border-gray-400 px-3 py-2"
          />
          <p id="title-error" class="mt-1 text-sm text-red-700"></p>
        </div>

        <div id="audio-field">
          <label for="audio" class="block text-sm font-semibold"
            >Audio file</label
          >
          <p id="audio-hint" class="text-xs text-muted">
            MP3, WAV, M4A or OGG, up to 5 MB.
          </p>
          <input
            id="audio"
            type="file"
            accept=".mp3,.wav,.m4a,.ogg"
            aria-describedby="audio-hint audio-error"
            class="mt-2 block w-full text-sm file:mr-3 file:rounded-md file:border-0 file:bg-brand-tint file:px-3 file:py-2 file:font-semibold file:text-brand"
          />
          <p id="audio-error" class="mt-1 text-sm text-red-700"></p>
          <audio
            id="audio-preview"
            controls
            aria-label="Preview of the chosen audio"
            class="mt-3 hidden w-full"
          ></audio>
        </div>

        <div class="flex items-start gap-3">
          <input
            id="published"
            type="checkbox"
            role="switch"
            checked
            aria-describedby="published-hint"
            class="mt-1 h-4 w-4"
          />
          <div>
            <label for="published" class="text-sm font-semibold"
              >Published</label
            >
            <p id="published-hint" class="text-xs text-muted">
              Published announcements are visible to all users.
            </p>
          </div>
        </div>

        <!-- Shown only while the audio is uploading -->
        <div id="upload-status" class="hidden">
          <label id="upload-label" for="upload-progress" class="text-sm"
            >Uploading audio: 0%</label
          >
          <progress
            id="upload-progress"
            max="100"
            value="0"
            class="mt-1 w-full"
          ></progress>
        </div>

        <div class="flex flex-wrap gap-3">
          <button
            type="submit"
            id="save-btn"
            class="rounded-md bg-brand px-5 py-2.5 font-semibold text-white hover:bg-brand-dark"
          >
            Create announcement
          </button>
          <a
            id="cancel-link"
            href="announcements.html"
            class="rounded-md border border-gray-400 px-5 py-2.5 font-semibold"
            >Cancel</a
          >
        </div>
      </form>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/announcement-form.js"></script>
  </body>
</html>
