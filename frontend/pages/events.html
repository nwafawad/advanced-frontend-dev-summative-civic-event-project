<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events, CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="bg-page text-ink">
   <main id="main">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 tabindex="-1" class="text-2xl font-bold">Events</h1>
      <p class="mt-1 text-sm text-muted">Find city events and register to attend.</p>
    </div>
    <a href="event-form.html" data-admin-only
       class="rounded-md bg-brand px-4 py-2 text-sm font-semibold text-white hover:bg-brand-dark">New event</a>
  </div>

  <div class="mt-6 flex flex-wrap gap-3">
    <label for="search" class="sr-only">Search events</label>
    <input id="search" type="search" placeholder="Search by title or location"
           class="w-full rounded-md border border-gray-400 px-3 py-2 sm:w-80">
    <label for="when" class="sr-only">Which events</label>
    <select id="when" class="rounded-md border border-gray-400 px-3 py-2">
      <option value="upcoming">Upcoming</option>
      <option value="past">Past</option>
      <option value="all">All</option>
    </select>
  </div>

  <p id="result-count" class="mt-4 text-sm text-muted" aria-live="polite"></p>
  <div id="event-list" class="mt-2 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
  <nav id="pagination" aria-label="Pages" class="mt-6 flex items-center justify-center gap-3"></nav>
</main>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/events.js"></script>
</body>
</html>
