<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcements, CivicEvents+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/tailwind.config.js"></script>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body class="bg-page text-ink">
    <main id="main">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold">Announcements</h1>
          <p class="mt-1 text-sm text-muted">
            Audio updates from the city. Press play to listen.
          </p>
        </div>
        <a
          href="announcement-form.html"
          data-admin-only
          class="rounded-md bg-brand px-4 py-2 text-sm font-semibold text-white hover:bg-brand-dark"
          >New announcement</a
        >
      </div>
      <div id="announcement-list" class="mt-6 grid gap-4 sm:grid-cols-2"></div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/announcements.js"></script>
  </body>
</html>
