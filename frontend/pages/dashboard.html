<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My dashboard, CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="bg-page text-ink">
  <main id="main">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 id="welcome" class="text-2xl font-bold">My dashboard</h1>
        <p id="updated-at" role="status" class="mt-1 text-sm text-muted"></p>
      </div>
      <button type="button" id="refresh-btn"
              class="rounded-md border border-gray-400 px-4 py-2 text-sm font-semibold hover:bg-brand-tint">Refresh</button>
    </div>

    <section aria-labelledby="totals-title" class="mt-6">
      <h2 id="totals-title" class="sr-only">Your activity</h2>
      <div id="stats"></div>
    </section>

    <section aria-labelledby="next-title" class="mt-8 rounded-lg border border-gray-200 bg-white p-6">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 id="next-title" class="text-lg font-semibold">Your next events</h2>
        <a href="my-registrations.html" class="text-sm font-semibold text-brand underline">All my registrations</a>
      </div>
      <div id="next-events" class="mt-4"></div>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/event-actions.js"></script>
  <script src="../js/pages/dashboard.js"></script>
</body>
</html>
