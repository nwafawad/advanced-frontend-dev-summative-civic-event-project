<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My profile, CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="bg-page text-ink">
  <main id="main">
    <h1 class="text-2xl font-bold">My profile</h1>

    <div class="mt-6 grid max-w-4xl gap-6 md:grid-cols-[1fr_16rem]">
      <form id="profile-form" class="space-y-5 rounded-lg border border-gray-200 bg-white p-6" novalidate>
        <p id="form-error" role="alert" class="empty:hidden rounded-md bg-red-50 p-3 text-sm text-red-800"></p>

        <div>
          <label for="full_name" class="block text-sm font-semibold">Full name</label>
          <input id="full_name" required type="text" autocomplete="name" aria-describedby="full_name-error"
                 class="mt-1 w-full rounded-md border border-gray-400 px-3 py-2">
          <p id="full_name-error" class="mt-1 text-sm text-red-700"></p>
        </div>

        <div>
          <label for="email" class="block text-sm font-semibold">Email</label>
          <input id="email" required type="email" autocomplete="email" aria-describedby="email-error"
                 class="mt-1 w-full rounded-md border border-gray-400 px-3 py-2">
          <p id="email-error" class="mt-1 text-sm text-red-700"></p>
        </div>

        <button type="submit" id="save-btn"
                class="rounded-md bg-brand px-5 py-2.5 font-semibold text-white hover:bg-brand-dark">Save changes</button>
      </form>

      <section aria-labelledby="account-title" class="rounded-lg border border-gray-200 bg-white p-6">
        <h2 id="account-title" class="font-semibold">Account</h2>
        <dl id="account-info" class="mt-3 space-y-3 text-sm"></dl>
        <p class="mt-4 text-xs text-muted">Role and status are set by an administrator.</p>
      </section>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/profile.js"></script>
</body>
</html>
