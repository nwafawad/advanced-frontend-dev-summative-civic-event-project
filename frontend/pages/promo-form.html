<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promo form, CivicEvents+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/tailwind.config.js"></script>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body class="bg-page text-ink">
    <main id="main">
      <a id="back-link" href="promos.html" class="text-sm text-brand underline"
        >Back to promos</a
      >
      <h1 class="mt-4 text-2xl font-bold">New promo</h1>

      <form
        id="promo-form"
        class="mt-6 max-w-2xl space-y-5 rounded-lg border border-gray-200 bg-white p-6"
        novalidate
      >
        <p
          id="form-error"
          role="alert"
          class="empty:hidden rounded-md bg-red-50 p-3 text-sm text-red-800"
        ></p>

        <div>
          <label for="title" class="block text-sm font-semibold">Title</label>
          <input
            id="title"
            type="text"
            aria-describedby="title-error"
            class="mt-1 w-full rounded-md border border-gray-400 px-3 py-2"
          />
          <p id="title-error" class="mt-1 text-sm text-red-700"></p>
        </div>

        <div>
          <label for="description" class="block text-sm font-semibold"
            >Description</label
          >
          <textarea
            id="description"
            rows="3"
            aria-describedby="description-error"
            class="mt-1 w-full rounded-md border border-gray-400 px-3 py-2"
          ></textarea>
          <p id="description-error" class="mt-1 text-sm text-red-700"></p>
        </div>

        <div>
          <label for="video" class="block text-sm font-semibold"
            >Video file</label
          >
          <p id="video-hint" class="text-xs text-muted">
            MP4, MOV, AVI or MKV, up to 8 MB. MP4 plays in every browser.
          </p>
          <input
            id="video"
            type="file"
            accept=".mp4,.mov,.avi,.mkv"
            aria-describedby="video-hint video-error"
            class="mt-2 block w-full text-sm file:mr-3 file:rounded-md file:border-0 file:bg-brand-tint file:px-3 file:py-2 file:font-semibold file:text-brand"
          />
          <p id="video-error" class="mt-1 text-sm text-red-700"></p>
          <video
            id="video-preview"
            controls
            preload="metadata"
            aria-label="Preview of the video"
            class="mt-3 hidden max-h-64 w-full rounded-md bg-black"
          ></video>
        </div>

        <div>
          <label for="caption_text" class="block text-sm font-semibold"
            >Captions</label
          >
          <p id="caption-hint" class="text-xs text-muted">
            Write one caption per line. They are shown one after another, spread
            evenly across the video, and also used as the transcript.
          </p>
          <textarea
            id="caption_text"
            rows="5"
            aria-describedby="caption-hint caption_text-error"
            class="mt-1 w-full rounded-md border border-gray-400 px-3 py-2"
          ></textarea>
          <p id="caption_text-error" class="mt-1 text-sm text-red-700"></p>
        </div>

        <div class="flex items-start gap-3">
          <input
            id="published"
            type="checkbox"
            role="switch"
            checked
            aria-describedby="published-hint"
            class="mt-1 h-4 w-4"
          />
          <div>
            <label for="published" class="text-sm font-semibold"
              >Published</label
            >
            <p id="published-hint" class="text-xs text-muted">
              Published promos are visible to all users.
            </p>
          </div>
        </div>

        <!-- Shown only while the video is uploading -->
        <div id="upload-status" class="hidden">
          <label id="upload-label" for="upload-progress" class="text-sm"
            >Uploading video: 0%</label
          >
          <progress
            id="upload-progress"
            max="100"
            value="0"
            class="mt-1 w-full"
          ></progress>
        </div>

        <div class="flex flex-wrap gap-3">
          <button
            type="submit"
            id="save-btn"
            class="rounded-md bg-brand px-5 py-2.5 font-semibold text-white hover:bg-brand-dark"
          >
            Create promo
          </button>
          <a
            id="cancel-link"
            href="promos.html"
            class="rounded-md border border-gray-400 px-5 py-2.5 font-semibold"
            >Cancel</a
          >
        </div>
      </form>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/promo-form.js"></script>
  </body>
</html>
