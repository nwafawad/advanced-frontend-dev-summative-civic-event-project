<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-page text-ink">
  <main id="main">
    <p class="p-6 text-muted">Loading…</p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Not logged in goes to login, admins go to the dashboard, everyone else to events.
    if (!Auth.isLoggedIn()) {
      location.href = 'pages/login.html';
    } else if (Auth.isAdmin()) {
      location.href = 'pages/admin/dashboard.html';
    } else {
      location.href = 'pages/events.html';
    }
  </script>
</body>
</html>
